version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/ports/flutter"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(flutter)"
    groups:
      pub:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/ports/react-native"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(react-native)"
    groups:
      npm:
        patterns:
          - "*"
