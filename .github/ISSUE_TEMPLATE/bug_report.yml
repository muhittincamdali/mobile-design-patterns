name: Bug Report
description: Report errors, broken code, or incorrect information
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve our patterns!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What issue did you find?
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: Where is the issue?
      placeholder: |
        - Pattern: Singleton
        - Section: iOS Implementation
        - File: patterns/creational/singleton.md
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Issue Type
      options:
        - Code Doesn't Compile
        - Incorrect Pattern Implementation
        - Outdated Syntax
        - Broken Link
        - Typo/Grammar
        - Missing Information
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Both
        - General
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested Fix
      description: If you have a correction
      placeholder: The correct implementation is...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
          required: true
