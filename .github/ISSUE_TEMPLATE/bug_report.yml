name: Bug report
description: A pattern type, a port or the example app does not behave as documented.
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Swift package (MobilePatterns)
        - Example app (PatternGallery)
        - Flutter port
        - React Native port
        - Documentation
    validations:
      required: true

  - type: input
    id: type
    attributes:
      label: Type
      description: The type or function involved, for example Repository or DeepLinkParser.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code that shows the problem. A failing test is ideal.
      render: swift
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package version or commit, Xcode, Swift, OS (or Flutter / Node versions for the ports).
      placeholder: "2.0.0, Xcode 26.6, Swift 6.2, iOS 26.6 simulator"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Remove tokens, personal data and internal URLs from code and output before you post.
        Report security problems privately as described in SECURITY.md, not here.
