name: Bug Report
description: Report an issue with a pattern implementation or documentation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: dropdown
    id: category
    attributes:
      label: Pattern Category
      options:
        - Creational
        - Structural
        - Behavioral
        - Architectural
        - Mobile-Specific
        - Concurrency
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: pattern
    attributes:
      label: Pattern Name
      placeholder: e.g., Singleton, Observer, MVVM
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Swift
        - Dart
        - TypeScript
        - All
        - N/A
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested Fix
      description: If you have a suggestion on how to fix this.
    validations:
      required: false
