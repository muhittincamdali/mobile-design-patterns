name: Pattern or feature request
description: Propose a new pattern, a change to an existing type, or a port.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem in app code
      description: The bug or duplicated decision this would remove, ideally with a short example of the code as it is today.
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: How the call site would look.
      render: swift

  - type: textarea
    id: edge-cases
    attributes:
      label: Edge cases
      description: Cancellation, concurrency, limits, invalid input; what should happen in each.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Existing types, Apple frameworks or packages that already cover part of it.
