name: Feature Request
description: Suggest a new pattern or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a pattern to add? Let us know!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added?
      placeholder: Describe your suggestion...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New Design Pattern
        - Code Example (iOS)
        - Code Example (Android)
        - Diagram/Visualization
        - Use Case Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: pattern-type
    attributes:
      label: Pattern Type
      options:
        - Creational
        - Structural
        - Behavioral
        - Architectural
        - Mobile-Specific
        - Not Applicable
    validations:
      required: false

  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this valuable?
      placeholder: This pattern is commonly used in...
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I can help implement this
          required: false
